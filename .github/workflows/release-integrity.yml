name: Release 1 scientific integrity
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct original cell metadata with checksum verification
        run: python3 scripts/assemble_cells.py
      - name: Validate atlas data and required files
        run: python3 scripts/validate_release.py
